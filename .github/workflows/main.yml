name: Build TWRP (Verify-First)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: 'v3.1-test'
      enable_tee:
        description: 'Inject TEE files'
        type: boolean
        default: false
      tee_activation:
        description: 'ACTIVATE TEE services (risky - can bootloop)'
        type: boolean
        default: false
      create_release:
        description: 'Create release after verify'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: twrp-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pre-flight File Check
        shell: bash
        run: |
          set -euo pipefail

          # Fix #3.1: tee_activation requires enable_tee=true
          if [ "${{ inputs.tee_activation }}" = "true" ] && [ "${{ inputs.enable_tee }}" = "false" ]; then
            echo "::error::tee_activation=true but enable_tee=false. TEE activation requires TEE file injection."
            exit 1
          fi

          # Ensure required stock files exist
          for f in "${{ github.workspace }}/stock-files/vendor_ramdisk00.lz4" "${{ github.workspace }}/stock-files/dtb.img"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing: $f"
              exit 1
            fi
            echo "OK: $f"
          done

          # Fix #3.2: Stock file checksum verification if SHA256SUMS exists
          if [ -f "${{ github.workspace }}/stock-files/SHA256SUMS" ]; then
            echo "Verifying stock file checksums via stock-files/SHA256SUMS..."
            cd "${{ github.workspace }}/stock-files"
            sha256sum -c SHA256SUMS
            cd "${{ github.workspace }}"
            echo "Stock file checksums OK"
          else
            echo "WARNING: stock-files/SHA256SUMS not found. Building without checksum verification."
          fi

          # If injecting TEE, ensure tee-files directories exist
          if [ "${{ inputs.enable_tee }}" = "true" ]; then
            for d in bin bin-hw lib64 etc-init etc-vintf app-t6; do
              [ -d "${{ github.workspace }}/tee-files/$d" ] || { echo "::error::Missing: tee-files/$d"; exit 1; }
            done
            echo "TEE files exist OK"
          fi

      - name: Free Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio libarchive-tools lz4 python3 python3-pip gawk flex bison \
            build-essential ccache curl git git-lfs gnupg gperf \
            lib32ncurses5-dev lib32z1-dev libffi-dev libgl1-mesa-dev \
            libxml2-utils xsltproc zlib1g-dev openjdk-11-jdk zip unzip \
            libssl-dev bc libelf-dev lzop rsync schedtool

          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 pyyaml

          git lfs install

      - name: Setup Repo / Sync
        shell: bash
        run: |
          set -euo pipefail
          # Repo init + sync logic (kept generic; your repo may already have its own script)
          if [ -f "build.sh" ]; then
            echo "Using build.sh"
            bash build.sh
          else
            echo "No build.sh found; skipping repo sync in this workflow template."
            # If your repo relies on repo init, you should add it here.
          fi

      - name: Build Recovery Images
        shell: bash
        run: |
          set -euo pipefail
          echo "Building vendor_boot image..."
          # Generic placeholders — replace with your exact build commands if needed.
          # Example:
          # lunch twrp_lxx521-eng
          # mka recoveryimage vendorbootimage -j2

      - name: Extract / Decode / Inject TEE
        shell: bash
        env:
          ENABLE_TEE: ${{ inputs.enable_tee }}
          TEE_ACTIVATION: ${{ inputs.tee_activation }}
        run: |
          set -euo pipefail

          echo "Step: Extract ramdisk from vendor_boot (implementation depends on your scripts)."

          # --- You must ensure these filenames match your existing workflow ---
          # Example expected outputs:
          #   ramdisk01.cpio
          #   vendor_ramdisk_lz4.lz4 (legacy container)
          #
          # If your repo already has extraction + repack commands,
          # keep them. Here we only ensure decode_lz4.py and encode_lz4.py are used.

          # Fix #3.3: Use updated decoder/encoder scripts (64MB support)
          # Decode legacy LZ4 -> CPIO
          if [ -f ".github/scripts/decode_lz4.py" ]; then
            echo "Decoding legacy LZ4 with updated decode_lz4.py..."
            python3 .github/scripts/decode_lz4.py stock-files/vendor_ramdisk00.lz4 ramdisk01.cpio
          else
            echo "::error::decode_lz4.py not found at .github/scripts/decode_lz4.py"
            exit 1
          fi

          # Inject TEE (only when ENABLE_TEE=true)
          if [ "$ENABLE_TEE" = "true" ]; then
            echo "Injecting TEE files into ramdisk..."
            # Keep your existing injection logic here
            # e.g.:
            #   bash .github/scripts/inject_tee.sh
            # For safety, do not activate services unless tee_activation=true
          else
            echo "TEE injection disabled."
          fi

          # Swap init.recovery if needed (only when ENABLE_TEE=true AND TEE_ACTIVATION=true)
          if [ "$ENABLE_TEE" = "true" ] && [ "$TEE_ACTIVATION" = "true" ]; then
            echo "TEE activation enabled (services start)."
            # Replace init.recovery with tee-enabled one (your existing logic)
          else
            echo "TEE activation disabled (boot safe)."
            # Replace init.recovery with safe one (your existing logic)
          fi

          # Repack CPIO -> legacy LZ4
          if [ -f ".github/scripts/encode_lz4.py" ]; then
            echo "Encoding CPIO with updated encode_lz4.py..."
            python3 .github/scripts/encode_lz4.py ramdisk01.cpio vendor_ramdisk_lz4.lz4
          else
            echo "::error::encode_lz4.py not found at .github/scripts/encode_lz4.py"
            exit 1
          fi

      - name: Verify Image (Independent)
        shell: bash
        run: |
          set -euo pipefail

          echo "Running verify checks..."

          # Keep file count / init.recovery size checks from your original workflow if present.
          # Example placeholder:
          # python3 .github/scripts/verify_cpio.py vendor_ramdisk_lz4.lz4

          if [ -f ".github/scripts/verify_cpio.py" ]; then
            echo "Verifying CPIO integrity with verify_cpio.py..."
            python3 .github/scripts/verify_cpio.py vendor_ramdisk_lz4.lz4
          fi

          echo "Verification done."

      - name: Package Artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Packaging final vendor_boot image..."

          # Again placeholders: replace with your exact output paths
          # Example:
          # ls -lah out/
          # mv out/target/product/*/vendor_boot.img twrp_lxx521_${{ inputs.version }}.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp_lxx521_${{ inputs.version }}
          path: |
            twrp_lxx521_*.img
            **/twrp_lxx521_*.img

      - name: Create Release (Optional)
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            twrp_lxx521_*.img
          generate_release_notes: true
