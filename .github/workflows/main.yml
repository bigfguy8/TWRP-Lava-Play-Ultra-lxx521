name: Build TWRP (Verify-First)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.2.0)'
        required: true
        default: 'v3.2.0'
      twrp_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-14
          - twrp-14.1
      enable_tee:
        description: 'Inject TEE files (TrustKernel TEE)'
        type: boolean
        default: true
      tee_activation:
        description: 'ACTIVATE TEE services (risky - can bootloop if incompatible)'
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub release after successful verify'
        type: boolean
        default: false
      skip_verify:
        description: 'Skip independent verify job (faster, less safe)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 10G
  _JAVA_OPTIONS: "-Xmx3g"
  JACK_SERVER_VM_ARGUMENTS: "-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx3g"

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TWRP_BRANCH: ${{ github.event.inputs.twrp_branch || 'twrp-14.1' }}
      ENABLE_TEE: ${{ github.event.inputs.enable_tee || 'true' }}
      TEE_ACTIVATION: ${{ github.event.inputs.tee_activation || 'false' }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    outputs:
      artifact_name: ${{ steps.prepare_artifact.outputs.artifact_name }}
      sha256: ${{ steps.prepare_artifact.outputs.sha256 }}
      twrp_branch: ${{ env.TWRP_BRANCH }}
      enable_tee: ${{ env.ENABLE_TEE }}
      tee_activation: ${{ env.TEE_ACTIVATION }}
      version: ${{ env.VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pre-flight File Check
        run: |
          if [ "${{ env.TEE_ACTIVATION }}" = "true" ] && [ "${{ env.ENABLE_TEE }}" = "false" ]; then
            echo "::error::tee_activation=true but enable_tee=false. TEE activation requires TEE file injection."
            exit 1
          fi
          
          for f in "stock-files/vendor_ramdisk00.lz4" "stock-files/dtb.img"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing: $f"
              exit 1
            fi
            echo "OK: $f"
          done
          
          if [ "${{ env.ENABLE_TEE }}" = "true" ]; then
            for d in bin bin-hw lib64 etc-init etc-vintf app-t6; do
              [ -d "tee-files/$d" ] || { echo "::error::Missing: tee-files/$d"; exit 1; }
            done
          fi

      - name: Maximize Free Disk Space
        run: |
          echo "Initial disk space:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/pypy
          sudo apt-get clean
          docker system prune -a -f
          echo "Final disk space:"
          df -h /

      - name: Setup Swap Memory
        run: |
          echo "Creating 16GB swap file to prevent OOM Killer..."
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=/swapfile bs=1G count=16
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap memory status:"
          free -h

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ env.TWRP_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.TWRP_BRANCH }}-
            ccache-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio libarchive-tools lz4 python3 python3-pip \
            gawk flex bison build-essential ccache curl git git-lfs \
            gnupg gperf lib32ncurses5-dev lib32z1-dev libffi-dev \
            libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev \
            openjdk-17-jdk zip unzip libssl-dev bc libelf-dev \
            lzop rsync schedtool python3-venv
          pip install --user lz4
          java -version

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync TWRP Manifest
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "Using TWRP branch: ${{ env.TWRP_BRANCH }}"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ env.TWRP_BRANCH }}" --depth=1
          repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone Device Tree & Kernel
        working-directory: workspace
        run: |
          git clone --depth=1 https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra device/lava/lxx521
          sed -i '/add_lunch_combo/d' device/lava/lxx521/vendorsetup.sh
          
          git clone --depth=1 --branch lineage-23.2 https://github.com/SiliconxLab/android_device_lava_lxx521-kernel device/lava/lxx521-kernel
          
          mkdir -p device/lava/lxx521/prebuilt/modules
          cp -r device/lava/lxx521-kernel/modules/* device/lava/lxx521/prebuilt/modules/
          cp device/lava/lxx521-kernel/images/* device/lava/lxx521/prebuilt/ 2>/dev/null || true
          echo "Device tree and kernel prebuilts ready"

      - name: Build TWRP
        working-directory: workspace
        env:
          CCACHE_DIR: /tmp/ccache
          CCACHE_MAXSIZE: 10G
          USE_CCACHE: 1
        run: |
          source build/envsetup.sh
          
          LUNCH_TARGET="twrp_lxx521-ap2a-eng"
          echo "Trying lunch target: $LUNCH_TARGET"
          lunch $LUNCH_TARGET
          
          # FIX: Use -j2 to prevent OOM on 16GB runner
          echo "Starting build with -j2..."
          mka recoveryimage vendorbootimage -j2
          
          echo "=== Built Images ==="
          find out/ -name "*.img" -exec ls -lh {} \;

      - name: Locate Build Tools
        working-directory: workspace
        id: locate_tools
        run: |
          UNPACK=$(find . -path "*/mkbootimg/unpack_bootimg.py" | head -1)
          MKBOOT=$(find . -path "*/mkbootimg/mkbootimg.py" | head -1)
          [ -z "$UNPACK" ] && { echo "::error::unpack_bootimg.py not found"; exit 1; }
          [ -z "$MKBOOT" ] && { echo "::error::mkbootimg.py not found"; exit 1; }
          echo "unpack_tool=$UNPACK" >> $GITHUB_OUTPUT
          echo "mkboot_tool=$MKBOOT" >> $GITHUB_OUTPUT

      - name: Extract Ramdisk
        id: extract_ramdisk
        run: |
          BUILT_VB=$(find workspace/out/target/product/lxx521 -name "vendor_boot.img" -type f | head -1)
          [ -z "$BUILT_VB" ] && { echo "::error::vendor_boot.img not found"; exit 1; }
          mkdir -p /tmp/built
          python3 ${{ steps.locate_tools.outputs.unpack_tool }} --boot_img "$BUILT_VB" --out /tmp/built
          cp /tmp/built/vendor_ramdisk01 /tmp/ramdisk01.lz4
          ls -lh /tmp/ramdisk01.lz4

      - name: Decode LZ4
        run: |
          python3 .github/scripts/decode_lz4.py /tmp/ramdisk01.lz4 /tmp/ramdisk01.cpio
          rm -rf /tmp/ramdisk_root
          mkdir -p /tmp/ramdisk_root
          cd /tmp/ramdisk_root
          bsdtar -xf /tmp/ramdisk01.cpio 2>/dev/null
          echo "Files extracted: $(find /tmp/ramdisk_root -type f | wc -l)"

      - name: Inject TEE Files
        if: env.ENABLE_TEE == 'true'
        run: |
          set -e
          RAMDISK=/tmp/ramdisk_root
          TEE=${{ github.workspace }}/tee-files
          
          mkdir -p $RAMDISK/vendor/bin $RAMDISK/vendor/bin/hw $RAMDISK/vendor/lib64
          mkdir -p $RAMDISK/vendor/etc/init $RAMDISK/vendor/etc/vintf/manifest
          mkdir -p $RAMDISK/vendor/app/t6
          
          rm -f $RAMDISK/vendor/etc/init/trustkernel.rc* 2>/dev/null || true
          rm -f $RAMDISK/vendor/etc/init/android.hardware.security.keymint@*.rc* 2>/dev/null || true
          rm -f $RAMDISK/vendor/etc/init/android.hardware.gatekeeper-service*.rc* 2>/dev/null || true
          
          cp $TEE/bin/teed $RAMDISK/vendor/bin/
          cp $TEE/bin/tee_check_keybox $RAMDISK/vendor/bin/
          cp $TEE/bin-hw/* $RAMDISK/vendor/bin/hw/
          cp $TEE/lib64/*.so $RAMDISK/vendor/lib64/
          
          if [ "${{ env.TEE_ACTIVATION }}" = "true" ]; then
            echo "TEE ACTIVATION MODE: Custom init will be used."
          else
            for rc_file in $TEE/etc-init/*.rc; do
              [ -f "$rc_file" ] || continue
              cp "$rc_file" "$RAMDISK/vendor/etc/init/$(basename "$rc_file")"
            done
            for xml_file in $TEE/etc-vintf/*.xml; do
              [ -f "$xml_file" ] || continue
              cp "$xml_file" "$RAMDISK/vendor/etc/vintf/manifest/$(basename "$xml_file")"
            done
          fi
          
          cp $TEE/app-t6/*.ta $RAMDISK/vendor/app/t6/
          cp $TEE/app-t6/cfg.ini $RAMDISK/vendor/app/t6/
          cp -r $TEE/app-t6/data $RAMDISK/vendor/app/t6/
          
          chmod 755 $RAMDISK/vendor/bin/teed $RAMDISK/vendor/bin/tee_check_keybox
          chmod 755 $RAMDISK/vendor/bin/hw/*
          find $RAMDISK/vendor/app/t6/data -type d -exec chmod 0755 {} \; 2>/dev/null || true
          find $RAMDISK/vendor/app/t6/data -type f -exec chmod 0644 {} \; 2>/dev/null || true
          
          if [ "${{ env.TEE_ACTIVATION }}" = "true" ] && [ -f "$TEE/etc-init/init.recovery.mt6878.rc.tee" ]; then
            cp "$TEE/etc-init/init.recovery.mt6878.rc.tee" "$RAMDISK/init.recovery.mt6878.rc"
            echo "TEE ACTIVATION: init.recovery replaced."
          fi

      - name: Repack CPIO
        run: |
          cd /tmp/ramdisk_root
          find . | cpio -o -H newc --owner=0:0 > /tmp/ramdisk01_new.cpio 2>/dev/null
          MAGIC=$(head -c 6 /tmp/ramdisk01_new.cpio)
          [ "$MAGIC" = "070701" ] || { echo "::error::Bad CPIO magic: $MAGIC"; exit 1; }
          python3 ${{ github.workspace }}/.github/scripts/encode_lz4.py /tmp/ramdisk01_new.cpio /tmp/ramdisk01_final.lz4

      - name: Build vendor_boot.img
        run: |
          cp ${{ github.workspace }}/stock-files/vendor_ramdisk00.lz4 /tmp/v00.lz4
          cp ${{ github.workspace }}/stock-files/dtb.img /tmp/dtb.img
          
          python3 ${{ steps.locate_tools.outputs.mkboot_tool }} \
            --header_version 4 --pagesize 4096 --base 0x00000000 \
            --kernel_offset 0x40000000 --ramdisk_offset 0x66f00000 \
            --tags_offset 0x47c80000 --dtb_offset 0x47c80000 \
            --vendor_cmdline "bootopt=64S3,32N2,64N2 androidboot.selinux=permissive" --board "" \
            --dtb /tmp/dtb.img \
            --ramdisk_type 1 --ramdisk_name "" \
            --vendor_ramdisk_fragment /tmp/v00.lz4 \
            --ramdisk_type 2 --ramdisk_name "recovery" \
            --vendor_ramdisk_fragment /tmp/ramdisk01_final.lz4 \
            --vendor_boot /tmp/vendor_boot.img
            
          sha256sum /tmp/vendor_boot.img > /tmp/vendor_boot.sha256

      - name: Internal Verify
        run: |
          HEADER=$(head -c 8 /tmp/vendor_boot.img)
          [ "$HEADER" = "VNDRBOOT" ] || { echo "::error::Bad header: $HEADER"; exit 1; }
          SIZE=$(stat -c '%s' /tmp/vendor_boot.img)
          [ "$SIZE" -le 67108864 ] || { echo "::error::Too big: $SIZE bytes (max 64MB)"; exit 1; }
          
          python3 ${{ github.workspace }}/.github/scripts/verify_cpio.py /tmp/ramdisk01_final.lz4
          
          rm -rf /tmp/verify_root && mkdir -p /tmp/verify_root
          cd /tmp/verify_root
          bsdtar -xf /tmp/verify.cpio 2>/dev/null
          
          FILE_COUNT=$(find /tmp/verify_root -type f | wc -l)
          [ "$FILE_COUNT" -ge 3400 ] || { echo "::error::Too few files: $FILE_COUNT"; exit 1; }
          
          if [ "${{ env.ENABLE_TEE }}" = "true" ]; then
            TEE_BINS=$(find /tmp/verify_root/vendor/bin -name "teed" -o -name "tee_check_keybox" | wc -l)
            [ "$TEE_BINS" -ge 2 ] || { echo "::error::TEE binaries missing"; exit 1; }
          fi
          echo "=== INTERNAL VERIFY PASSED ==="

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/vendor_boot.img /tmp/artifact/
          cp /tmp/ramdisk01_final.lz4 /tmp/artifact/ramdisk01.lz4
          cp stock-files/dtb.img /tmp/artifact/
          cp /tmp/verify_root/init.recovery.mt6878.rc /tmp/artifact/ 2>/dev/null || true
          
          cd /tmp/artifact
          sha256sum vendor_boot.img > SHA256SUMS
          echo "sha256=$(cat SHA256SUMS | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "artifact_name=twrp-${{ env.VERSION }}-${{ env.TWRP_BRANCH }}-${{ github.run_id }}" >> $GITHUB_OUTPUT
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: /tmp/artifact/
          retention-days: 30
          if-no-files-found: error

  verify:
    name: Independent Verify
    if: ${{ !github.event.inputs.skip_verify || github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools python3-pip
          pip install lz4
          
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifact
          
      - name: Verify
        run: |
          ls -lh artifact/
          cd artifact && sha256sum -c SHA256SUMS && cd ..
          
          HEADER=$(head -c 8 artifact/vendor_boot.img)
          [ "$HEADER" = "VNDRBOOT" ] || { echo "::error::Bad header"; exit 1; }
          
          SIZE=$(stat -c '%s' artifact/vendor_boot.img)
          [ "$SIZE" -le 67108864 ] || { echo "::error::Too big"; exit 1; }
          
          python3 .github/scripts/verify_cpio.py artifact/ramdisk01.lz4
          
          mkdir -p /tmp/v_root && cd /tmp/v_root
          bsdtar -xf /tmp/verify.cpio 2>/dev/null
          
          FILES=$(find . -type f | wc -l)
          [ "$FILES" -ge 3400 ] || { echo "::error::Too few: $FILES"; exit 1; }
          
          if [ "${{ needs.build.outputs.enable_tee }}" = "true" ]; then
            TEE_BINS=$(find . -path "*/vendor/bin/teed" -o -path "*/vendor/bin/tee_check_keybox" | wc -l)
            echo "TEE binaries: $TEE_BINS"
            [ "$TEE_BINS" -ge 2 ] || { echo "::error::TEE binaries missing in independent verify"; exit 1; }
          fi
          echo "=== INDEPENDENT VERIFY PASSED ==="

  release:
    name: Create Release
    needs: [build, verify]
    if: ${{ (github.event.inputs.create_release == 'true' || github.event_name == 'push') && github.event.inputs.skip_verify != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-files
          
      - name: Prepare Release
        run: |
          cd release-files
          mv vendor_boot.img twrp_lxx521_${{ needs.build.outputs.version }}.img
          sha256sum twrp_lxx521_${{ needs.build.outputs.version }}.img > SHA256SUMS
          ls -lh
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "TWRP ${{ needs.build.outputs.version }} - Lava Play Ultra 5G (LXX521)"
          body: |
            ## TWRP ${{ needs.build.outputs.version }} for Lava Play Ultra 5G (LXX521)
            
            **Branch:** `${{ needs.build.outputs.twrp_branch }}`
            **TEE Enabled:** `${{ needs.build.outputs.enable_tee }}`
            **TEE Activation:** `${{ needs.build.outputs.tee_activation }}`
            
            ### ⚠️ Critical Warning
            - Unlocking the bootloader erases all user data.
            - Keep a backup of your stock `vendor_boot.img` before flashing.
            
            ### Installation
            Flash to `vendor_boot_a` using mtkclient:
            ```bash
            python mtk.py w vendor_boot_a twrp_lxx521_${{ needs.build.outputs.version }}.img
            python mtk.py reset
            ```
            
            **Please verify the SHA256 checksum before flashing!**
