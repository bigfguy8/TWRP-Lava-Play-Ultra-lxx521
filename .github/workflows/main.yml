name: Build TWRP Custom Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP for Lava Play Ultra 5G (lxx521)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk flex bison build-essential ccache curl git-core \
            git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            libffi-dev libgl1-mesa-dev libxml2-utils xsltproc \
            zlib1g-dev python3 python3-pip openjdk-11-jdk \
            zip unzip libssl-dev bc libelf-dev lzop rsync schedtool

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize and Sync TWRP Manifest
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone Device and Kernel Trees
        working-directory: workspace
        run: |
          git clone https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra device/lava/lxx521 --depth=1
          git clone https://github.com/SiliconxLab/android_device_lava_lxx521-kernel -b lineage-23.2 device/lava/lxx521-kernel --depth=1

      - name: Build TWRP Image
        working-directory: workspace
        run: |
          if [ ! -f build/envsetup.sh ]; then
            echo "Error: build/envsetup.sh not found."
            exit 1
          fi
          source build/envsetup.sh

          echo "========= DEVICE TREE DIAGNOSTIC ========="
          ls -la device/lava/lxx521/ || true
          echo "--- AndroidProducts.mk ---"
          cat device/lava/lxx521/AndroidProducts.mk 2>/dev/null || echo "MISSING"
          echo "--- vendorsetup.sh ---"
          cat device/lava/lxx521/vendorsetup.sh 2>/dev/null || echo "MISSING"
          echo "--- *.mk files ---"
          ls device/lava/lxx521/*.mk 2>/dev/null || true
          echo "=========================================="

          LUNCHED=false
          for combo in \
            "twrp_lxx521-ap3a-eng" \
            "twrp_lxx521-ap3a-userdebug" \
            "twrp_lxx521-eng" \
            "twrp_lxx521-userdebug" \
            "omni_lxx521-eng" \
            "omni_lxx521-userdebug" \
            "lineage_lxx521-eng" \
            "lineage_lxx521-userdebug" \
            "lxx521-eng" \
            "lxx521-userdebug" \
            "full_lxx521-eng" \
            "full_lxx521-userdebug"; do
            echo ">>> Attempting: lunch $combo"
            if lunch "$combo" >/tmp/lunch_attempt.log 2>&1; then
              echo "✅ SUCCESS: lunch $combo"
              LUNCHED=true
              break
            else
              tail -2 /tmp/lunch_attempt.log || true
            fi
          done

          if [ "$LUNCHED" = false ]; then
            echo "❌ ALL LUNCH COMBOS FAILED."
            echo "Listing available lunch targets (if any):"
            (lunch 2>&1 | head -100) || true
            echo "---- AndroidProducts.mk again ----"
            cat device/lava/lxx521/AndroidProducts.mk || echo "no file"
            exit 1
          fi

          mka recoveryimage vendor_boot -j2 showcommands || make recoveryimage vendor_boot -j2 showcommands

          mkdir -p output
          find out/ -type f -name "*.img" -exec cp -v {} output/ \; 2>/dev/null || true

          echo "=== Generated Output Images ==="
          ls -la output/

          if [ -z "$(ls -A output/)" ]; then
            echo "ERROR: No .img files found anywhere in out/"
            exit 1
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Lava-Play-Ultra-lxx521
          path: workspace/output/*.img
          if-no-files-found: error
