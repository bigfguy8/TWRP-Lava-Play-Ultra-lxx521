name: Build TWRP Custom Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twrp-lxx521-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TWRP for Lava Play Ultra 5G (lxx521)
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    defaults:
      run:
        shell: bash

    env:
      DEVICE_PATH: device/lava/lxx521
      PRODUCT: twrp_lxx521
      ALLOW_MISSING_DEPENDENCIES: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare Workspace and Disk
        run: |
          set -eo pipefail
          mkdir -p workspace/diagnostics workspace/output
          echo "=== Disk before cleanup ==="
          df -h .
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo apt-get clean
          echo "=== Disk after cleanup ==="
          df -h .

      - name: Install Build Dependencies
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gawk flex bison build-essential ccache curl git \
            git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            libffi-dev libgl1-mesa-dev libxml2-utils xsltproc \
            zlib1g-dev python3 python3-pip openjdk-11-jdk \
            zip unzip libssl-dev bc libelf-dev lzop \
            rsync schedtool lz4
          git lfs install --skip-repo

      - name: Install Repo Tool
        run: |
          set -eo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          test -s "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and Sync TWRP Manifest (twrp-12.1)
        working-directory: workspace
        run: |
          set -eo pipefail
          exec > >(tee -a diagnostics/sync.log) 2>&1
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 \
            --depth=1
          repo sync \
            -c -j4 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune
          repo manifest -r -o diagnostics/resolved-manifest.xml

      - name: Clone Device and Kernel Trees
        working-directory: workspace
        run: |
          set -eo pipefail
          exec > >(tee -a diagnostics/trees.log) 2>&1
          git clone --depth=1 \
            https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra \
            "$DEVICE_PATH"
          git clone --depth=1 --branch lineage-23.2 \
            https://github.com/SiliconxLab/android_device_lava_lxx521-kernel \
            device/lava/lxx521-kernel
          git -C "$DEVICE_PATH" lfs pull || echo "No LFS in device tree"
          git -C device/lava/lxx521-kernel lfs pull || echo "No LFS in kernel tree"
          {
            echo "=== Workflow commit ==="
            printf '%s\n' "$GITHUB_SHA"
            echo "=== Device tree commit ==="
            git -C "$DEVICE_PATH" log -1 --format='%H %s'
            echo "=== Kernel tree commit ==="
            git -C device/lava/lxx521-kernel log -1 --format='%H %s'
          } | tee diagnostics/source-revisions.txt

      - name: Configure and Build Recovery
        working-directory: workspace
        run: |
          set -eo pipefail
          exec > >(tee -a diagnostics/build.log) 2>&1

          echo "=== Host environment ==="
          pwd
          java -version 2>&1 || true
          python3 --version
          free -h
          df -h .

          echo "=== Required configuration files ==="
          for file in \
            build/envsetup.sh \
            "$DEVICE_PATH/AndroidProducts.mk" \
            "$DEVICE_PATH/twrp_lxx521.mk" \
            "$DEVICE_PATH/BoardConfig.mk"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done

          mkdir -p diagnostics/device-config
          cp "$DEVICE_PATH/"*.mk diagnostics/device-config/
          if [ -f "$DEVICE_PATH/vendorsetup.sh" ]; then
            cp "$DEVICE_PATH/vendorsetup.sh" diagnostics/device-config/
          fi

          echo "=== Registered products ==="
          cat "$DEVICE_PATH/AndroidProducts.mk"

          echo "=== Environment setup ==="
          source build/envsetup.sh

          if ! declare -F lunch >/dev/null; then
            echo "::error::Environment setup did not define lunch."
            exit 1
          fi

          echo "=== Final lunch: $PRODUCT-eng ==="
          if lunch "$PRODUCT-eng" > diagnostics/lunch-final.log 2>&1; then
            cat diagnostics/lunch-final.log
          else
            cat diagnostics/lunch-final.log
            echo "::error::Lunch failed for $PRODUCT-eng"
            exit 1
          fi

          ACTUAL_PRODUCT="$(get_build_var TARGET_PRODUCT)"
          PRODUCT_OUT="$(get_build_var PRODUCT_OUT)"
          echo "TARGET_PRODUCT=$ACTUAL_PRODUCT"
          echo "PRODUCT_OUT=$PRODUCT_OUT"

          if [ -z "$PRODUCT_OUT" ] || [ "$PRODUCT_OUT" = "/" ]; then
            echo "::error::Invalid product output directory."
            exit 1
          fi

          {
            printf 'Lunch: %s-eng\n' "$PRODUCT"
            printf 'Product: %s\n' "$ACTUAL_PRODUCT"
            printf 'Output directory: %s\n' "$PRODUCT_OUT"
            printf 'Run: https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } | tee diagnostics/selected-configuration.txt

          echo "=== Attempt recoveryimage ==="
          mka recoveryimage -j2 || echo "::warning::recoveryimage target failed"

          echo "=== Attempt vendorbootimage ==="
          mka vendorbootimage -j2 || echo "::warning::vendorbootimage target failed"

          mkdir -p output
          find "$PRODUCT_OUT" -maxdepth 1 -type f -name "*.img" -exec cp -v {} output/ \; 2>/dev/null || true

          echo "=== Output images found ==="
          ls -lh output/ || true

          if [ -z "$(ls -A output/ 2>/dev/null)" ]; then
            echo "::error::No .img files were produced."
            exit 1
          fi

          (
            cd output
            for img in *.img; do
              [ -f "$img" ] && sha256sum "$img"
            done > SHA256SUMS
            cat SHA256SUMS
          )

          cp diagnostics/source-revisions.txt output/ 2>/dev/null || true
          cp diagnostics/selected-configuration.txt output/ 2>/dev/null || true

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxx521-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Build Output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-lxx521-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace/output/
          if-no-files-found: error
          retention-days: 14
