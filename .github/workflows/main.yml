name: Build TWRP Custom Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP for Lava Play Ultra 5G (lxx521)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk flex bison build-essential ccache curl git-core \
            git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            libffi-dev libgl1-mesa-dev libxml2-utils xsltproc \
            zlib1g-dev python3 python3-pip openjdk-11-jdk \
            zip unzip libssl-dev bc libelf-dev lzop rsync schedtool

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize and Sync TWRP Manifest
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone Device and Kernel Trees
        working-directory: workspace
        run: |
          git clone https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra device/lava/lxx521 --depth=1
          git clone https://github.com/SiliconxLab/android_device_lava_lxx521-kernel -b lineage-23.2 device/lava/lxx521-kernel --depth=1

      - name: Build TWRP Image
        working-directory: workspace
        run: |
          if [ ! -f build/envsetup.sh ]; then
            echo "Error: build/envsetup.sh not found."
            exit 1
          fi
          source build/envsetup.sh
          lunch twrp_lxx521-userdebug || lunch twrp_lxx521-eng

          export COMBINED_OUT_DIR=out
          mka recoveryimage vendor_boot -j2 showcommands || make recoveryimage vendor_boot -j2 showcommands

          mkdir -p output
          find out/ -type f -name "*.img" -exec cp -v {} output/ \; 2>/dev/null || true

          echo "=== Generated Output Images Found ==="
          ls -la output/

          if [ -z "$(ls -A output/)" ]; then
            echo "ERROR: No .img files found anywhere in out/ directory!"
            exit 1
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Lava-Play-Ultra-lxx521
          path: workspace/output/*.img
          if-no-files-found: error
