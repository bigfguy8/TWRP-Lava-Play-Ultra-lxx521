name: Build TWRP (Verify-First)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - ".github/scripts/**"
      - "stock-files/**"
      - "tee-files/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag"
        required: true
        default: "v3.0.1-test"
      enable_tee:
        description: "Inject TEE files"
        type: boolean
        default: false
      tee_activation:
        description: "ACTIVATE TEE services (risky - can bootloop)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Build Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "enable_tee=${{ inputs.enable_tee }}" >> "$GITHUB_OUTPUT"
            echo "tee_activation=${{ inputs.tee_activation }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "enable_tee=false" >> "$GITHUB_OUTPUT"
            echo "tee_activation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight File Check
        run: |
          if [ "${{ steps.vars.outputs.tee_activation }}" = "true" ] && [ "${{ steps.vars.outputs.enable_tee }}" = "false" ]; then
            echo "::error::tee_activation=true but enable_tee=false."
            exit 1
          fi

          for f in \
            "${{ github.workspace }}/stock-files/vendor_ramdisk00.lz4" \
            "${{ github.workspace }}/stock-files/dtb.img"; do
            [ -f "$f" ] || { echo "::error::Missing: $f"; exit 1; }
            echo "OK: $f"
          done

          [ -f "${{ github.workspace }}/stock-files/SHA256SUMS" ] || {
            echo "::error::stock-files/SHA256SUMS missing"
            exit 1
          }

          cd "${{ github.workspace }}/stock-files"
          sha256sum -c SHA256SUMS
          cd "${{ github.workspace }}"

          if [ "${{ steps.vars.outputs.enable_tee }}" = "true" ]; then
            for d in bin bin-hw lib64 etc-init etc-vintf app-t6; do
              [ -d "${{ github.workspace }}/tee-files/$d" ] || {
                echo "::error::Missing: tee-files/$d"
                exit 1
              }
            done
          fi

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio libarchive-tools lz4 python3 python3-pip gawk flex bison \
            build-essential ccache curl git git-lfs gnupg gperf \
            lib32ncurses5-dev lib32z1-dev libffi-dev libgl1-mesa-dev \
            libxml2-utils xsltproc zlib1g-dev openjdk-11-jdk zip unzip \
            libssl-dev bc libelf-dev lzop rsync schedtool
          pip install lz4

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP Manifest
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone Pinned Device Tree and Kernel
        working-directory: workspace
        run: |
          git clone https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra device/lava/lxx521
          git -C device/lava/lxx521 checkout 5f3e630031198fd7046cfa335470d8aa1873d4fc

          git clone --branch lineage-23.2 https://github.com/SiliconxLab/android_device_lava_lxx521-kernel device/lava/lxx521-kernel
          git -C device/lava/lxx521-kernel checkout 8aed162ead09ebfa63bdc0c4423c83d515e02fab

      - name: Build TWRP
        working-directory: workspace
        run: |
          source build/envsetup.sh
          lunch twrp_lxx521-eng
          mka recoveryimage vendorbootimage -j2
          find out/ -name "*.img" -exec ls -lh {} ;

      - name: Locate Tools
        working-directory: workspace
        run: |
          UNPACK=$(find . -path "*/mkbootimg/unpack_bootimg.py" | head -1)
          MKBOOT=$(find . -path "*/mkbootimg/mkbootimg.py" | head -1)
          [ -z "$UNPACK" ] && exit 1
          [ -z "$MKBOOT" ] && exit 1
          echo "UNPACK_TOOL=$UNPACK" >> "$GITHUB_ENV"
          echo "MKBOOT_TOOL=$MKBOOT" >> "$GITHUB_ENV"

      - name: Extract Ramdisk
        working-directory: workspace
        run: |
          BUILT_VB=$(find out/target/product/lxx521 -name "vendor_boot.img" -type f | head -1)
          [ -z "$BUILT_VB" ] && { echo "::error::vendor_boot.img not found"; exit 1; }

          mkdir -p /tmp/built
          python3 "$UNPACK_TOOL" --boot_img "$BUILT_VB" --out /tmp/built
          cp /tmp/built/vendor_ramdisk01 /tmp/ramdisk01.lz4
          ls -lh /tmp/ramdisk01.lz4

      - name: Decode LZ4
        run: |
          python3 "${{ github.workspace }}/.github/scripts/decode_lz4.py" \
            /tmp/ramdisk01.lz4 /tmp/ramdisk01.cpio

          rm -rf /tmp/ramdisk_root
          mkdir -p /tmp/ramdisk_root
          cd /tmp/ramdisk_root
          bsdtar -xf /tmp/ramdisk01.cpio
          echo "Files: $(find /tmp/ramdisk_root -type f | wc -l)"

      - name: Inject TEE
        if: ${{ steps.vars.outputs.enable_tee == 'true' }}
        run: |
          set -e
          RAMDISK=/tmp/ramdisk_root
          TEE="${{ github.workspace }}/tee-files"

          mkdir -p \
            "$RAMDISK/vendor/bin" \
            "$RAMDISK/vendor/bin/hw" \
            "$RAMDISK/vendor/lib64" \
            "$RAMDISK/vendor/etc/init" \
            "$RAMDISK/vendor/etc/vintf/manifest" \
            "$RAMDISK/vendor/app/t6"

          rm -f \
            "$RAMDISK/vendor/etc/init/trustkernel.rc" \
            "$RAMDISK/vendor/etc/init/trustkernel.rc.disabled" \
            "$RAMDISK/vendor/etc/init/android.hardware.security.keymint@"*.rc \
            "$RAMDISK/vendor/etc/init/android.hardware.security.keymint@"*.rc.disabled \
            "$RAMDISK/vendor/etc/init/android.hardware.gatekeeper-service"*.rc \
            "$RAMDISK/vendor/etc/init/android.hardware.gatekeeper-service"*.rc.disabled \
            "$RAMDISK/vendor/etc/init/init.recovery.mt6878.rc.tee" \
            2>/dev/null || true

          cp "$TEE/bin/teed" "$RAMDISK/vendor/bin/"
          cp "$TEE/bin/tee_check_keybox" "$RAMDISK/vendor/bin/"
          cp "$TEE/bin-hw/"* "$RAMDISK/vendor/bin/hw/"
          cp "$TEE/lib64/"*.so "$RAMDISK/vendor/lib64/"

          if [ "${{ steps.vars.outputs.tee_activation }}" = "true" ]; then
            echo "TEE MODE: Skipping stock init and VINTF copies"
          else
            for rc_file in "$TEE/etc-init/"*.rc; do
              [ -f "$rc_file" ] || continue
              cp "$rc_file" "$RAMDISK/vendor/etc/init/$(basename "$rc_file").disabled"
            done

            for xml_file in "$TEE/etc-vintf/"*.xml; do
              [ -f "$xml_file" ] || continue
              cp "$xml_file" "$RAMDISK/vendor/etc/vintf/manifest/$(basename "$xml_file").disabled"
            done
          fi

          cp "$TEE/app-t6/"*.ta "$RAMDISK/vendor/app/t6/"
          cp "$TEE/app-t6/cfg.ini" "$RAMDISK/vendor/app/t6/"
          cp -r "$TEE/app-t6/data" "$RAMDISK/vendor/app/t6/"

          chmod 755 \
            "$RAMDISK/vendor/bin/teed" \
            "$RAMDISK/vendor/bin/tee_check_keybox"
          chmod 755 "$RAMDISK/vendor/bin/hw/"*

          find "$RAMDISK/vendor/app/t6/data" -type d -exec chmod 0755 {} ; 2>/dev/null || true
          find "$RAMDISK/vendor/app/t6/data" -type f -exec chmod 0644 {} ; 2>/dev/null || true

          if [ "${{ steps.vars.outputs.tee_activation }}" = "true" ] && [ -f "$TEE/etc-init/init.recovery.mt6878.rc.tee" ]; then
            cp "$TEE/etc-init/init.recovery.mt6878.rc.tee" "$RAMDISK/init.recovery.mt6878.rc"
            echo "TEE ACTIVATION: init.recovery replaced with TEE version"
          else
            echo "SAFE MODE: TEE files present but inactive"
          fi

      - name: Repack CPIO
        run: |
          cd /tmp/ramdisk_root
          find . | cpio -o -H newc --owner=0:0 > /tmp/ramdisk01_new.cpio

          MAGIC=$(head -c 6 /tmp/ramdisk01_new.cpio)
          [ "$MAGIC" = "070701" ] || { echo "::error::Bad CPIO magic: $MAGIC"; exit 1; }

          python3 "${{ github.workspace }}/.github/scripts/encode_lz4.py" \
            /tmp/ramdisk01_new.cpio /tmp/ramdisk01_final.lz4

      - name: Build vendor_boot.img
        working-directory: workspace
        run: |
          cp "${{ github.workspace }}/stock-files/vendor_ramdisk00.lz4" /tmp/v00.lz4
          cp "${{ github.workspace }}/stock-files/dtb.img" /tmp/dtb.img

          python3 "$MKBOOT_TOOL" \
            --header_version 4 \
            --pagesize 4096 \
            --base 0x00000000 \
            --kernel_offset 0x40000000 \
            --ramdisk_offset 0x66f00000 \
            --tags_offset 0x47c80000 \
            --dtb_offset 0x47c80000 \
            --vendor_cmdline "bootopt=64S3,32N2,64N2 androidboot.selinux=permissive" \
            --board "" \
            --dtb /tmp/dtb.img \
            --ramdisk_type 1 \
            --ramdisk_name "" \
            --vendor_ramdisk_fragment /tmp/v00.lz4 \
            --ramdisk_type 2 \
            --ramdisk_name "recovery" \
            --vendor_ramdisk_fragment /tmp/ramdisk01_final.lz4 \
            --vendor_boot /tmp/vendor_boot.img

          ls -lh /tmp/vendor_boot.img
          sha256sum /tmp/vendor_boot.img

      - name: Internal Verify
        run: |
          HEADER=$(head -c 8 /tmp/vendor_boot.img)
          [ "$HEADER" = "VNDRBOOT" ] || { echo "::error::Bad header: $HEADER"; exit 1; }

          SIZE=$(stat -c '%s' /tmp/vendor_boot.img)
          [ "$SIZE" -le 67108864 ] || { echo "::error::Too big: $SIZE bytes"; exit 1; }

          echo "Image size: $SIZE bytes"
          echo "=== INTERNAL VERIFY PASSED ==="

      - name: Prepare Artifact
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/vendor_boot.img /tmp/artifact/
          cp /tmp/ramdisk01_final.lz4 /tmp/artifact/ramdisk01.lz4
          cp "${{ github.workspace }}/stock-files/dtb.img" /tmp/artifact/

          cd /tmp/artifact
          sha256sum vendor_boot.img ramdisk01.lz4 dtb.img > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ steps.vars.outputs.version }}-${{ github.run_id }}
          path: /tmp/artifact/
          retention-days: 14
          if-no-files-found: error

  verify:
    name: Independent Verify
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: twrp-${{ needs.build.outputs.version }}-${{ github.run_id }}
          path: artifact

      - name: Verify Artifact
        run: |
          ls -lh artifact/
          cd artifact
          sha256sum -c SHA256SUMS

          HEADER=$(head -c 8 vendor_boot.img)
          [ "$HEADER" = "VNDRBOOT" ] || { echo "::error::Bad vendor_boot header"; exit 1; }

          SIZE=$(stat -c '%s' vendor_boot.img)
          [ "$SIZE" -le 67108864 ] || { echo "::error::vendor_boot.img too large"; exit 1; }

          echo "Independent verification passed"

  release:
    name: Create GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Download Verified Artifact
        uses: actions/download-artifact@v4
        with:
          name: twrp-${{ github.ref_name }}-${{ github.run_id }}
          path: artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TWRP ${{ github.ref_name }} for Lava Play Ultra 5G (LXX521)
          body: |
            Unofficial TWRP build for Lava Play Ultra 5G (LXX521 / MT6878).

            **Warning:** Bootloader unlock may erase data. Always keep a stock `vendor_boot.img` backup.

            Verify `SHA256SUMS` before flashing.
          files: |
            artifact/vendor_boot.img
            artifact/SHA256SUMS
